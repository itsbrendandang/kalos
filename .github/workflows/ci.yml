name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # ml carries the optional torch stack the engine tests need; portal so the
      # portal tests actually run (they importorskip fastapi) and mypy checks them
      # against real FastAPI types; dev brings ruff, mypy, and the type stubs.
      - run: python -m pip install -e ".[ml,portal,dev]"
      - run: ruff check kalos/
      - run: mypy   # config in pyproject [tool.mypy]
      - run: python -m pytest -q   # ESM-2 test skipped unless KALOS_TEST_ESM is set
