[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalos"
version = "0.1.0"
description = "Kalos: a domain-neutral Bayesian-optimization platform for sequential experiment design, built on BoTorch. Ships a bioprocess domain (NVIDIA BioNeMo / ESM-2 protein features) and supports mixed continuous/categorical design spaces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
# The BoTorch/GPyTorch GP surrogate, optimizer, and grouped-CV evaluation. The
# torch-free `kalos.kit` primitives (splits, drivers, conformal, gates,
# anonymizer) do not need this extra.
ml = ["torch>=2.2", "botorch>=0.11", "gpytorch>=1.11"]
# Real ESM-2 / BioNeMo protein embeddings. The lean KmerEmbedder needs none of this.
protein = ["transformers>=4.40"]
# The web portal (FastAPI viewer over the live engine). The portal drives the
# live GP surrogate, so it needs `ml` too - install as `kalos[ml,portal]`.
portal = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "openpyxl>=3.1"]
# The LLM tier of `kalos.normalize` (kalos/normalize/llm.py). Pydantic ships
# as a transitive dependency of `anthropic` and is not listed separately.
# The torch-free deterministic core (units/synonyms/plan/apply) and the
# offline fallback in llm.py need none of this.
normalize = ["anthropic>=0.40"]
# The TypeSafe tier of `kalos.normalize` (kalos/normalize/typesafe_tier.py):
# typed per-column judgments from TypeSafe's System One model, selected with
# KALOS_LLM_PROVIDER=typesafe. Imported lazily; without it (or without
# TYPESAFE_API_KEY) normalization falls back to the offline plan.
typesafe = ["typesafe-sdk>=0.7"]
# The XGBoost baseline the GP is scored against (kalos/core/evaluation.py,
# `xgboost_baseline_report`; reported as `cv_xgboost_baseline`). On Linux the
# CPU-only build (~6 MB) instead of the full wheel, which pulls ~200 MB of
# NCCL GPU libraries this CPU engine never uses; both install the `xgboost`
# module. Without it the baseline reports `available: false`.
xgboost = [
  "xgboost-cpu>=2.1.1; sys_platform == 'linux'",
  "xgboost>=2.0; sys_platform != 'linux'",
]
# `httpx` is the transport `starlette.testclient.TestClient` (used across the
# portal tests) needs. It is not pulled in transitively by fastapi/starlette, so
# a fresh `pip install -e ".[...,dev]"` (what CI does) leaves it absent and every
# portal test errors at import. Pinned below starlette's httpx2 cutover to keep
# the proven, locally-green transport. See CHANGELOG 2026-07-21 (later).
# `anthropic` is here as well as in the `normalize` extra: tests/test_normalize_llm.py
# imports the SDK to build mocked response objects for the live-LLM path. Those
# tests are fully hermetic (no network, no key), but a bare `import anthropic`
# still needs the package present, and CI installs `.[ml,portal,dev]` only - so
# without this the two mocked-live tests error out on a fresh CI checkout. Listing
# it in `dev` keeps that path genuinely covered instead of silently skipped.
# `typesafe-sdk` and xgboost are in `dev` for the same reason as `anthropic`: the wire test
# in tests/test_typesafe_tier.py drives the real SDK client against an
# in-process mock transport (no network, no key), tests/test_xgboost_baseline.py
# fits the real baseline, and CI installs `.[ml,portal,dev]` only.
dev = [
  "pytest>=7", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "scipy-stubs",
  "httpx>=0.27,<1", "anthropic>=0.40", "typesafe-sdk>=0.7",
  "xgboost-cpu>=2.1.1; sys_platform == 'linux'", "xgboost>=2.0; sys_platform != 'linux'",
]

# src layout: the package lives in src/kalos/, so tests and tools always run
# against the installed package, never against a stray copy on the CWD path.
[tool.setuptools.packages.find]
where = ["src"]
include = ["kalos*"]

# The portal serves two non-Python assets straight off the package directory:
# `index.html` (read at import in kalos/portal/app.py) and the vendored Satoshi
# brand face it references. Without this they are left out of the wheel
# entirely, and `python -m kalos.portal` from an installed package dies at
# import on a missing index.html. Source checkouts never noticed.
[tool.setuptools.package-data]
"kalos.portal" = ["index.html", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Pin the ruleset explicitly. With no [tool.ruff] section ruff applies whatever
# its current release defaults to, so a ruff upgrade CI never asked for can turn
# the build red on untouched code: 0.16.0 widened the defaults and put 217 new
# findings in kalos/ alone (UP/B/SIM/FURB/PL/RUF/I), which is what broke CI on
# 2026-07-24. These four are ruff's classic defaults and the set this codebase
# was written against; both 0.15 and 0.16 are clean under them.
# Adopting the wider set is a real cleanup worth doing on its own branch -- most
# of it is `ruff check --fix`-able -- but it is not a lint-config change.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["kalos"]
# Third-party libs without usable stubs in this project's context. torch/botorch/
# gpytorch DO ship py.typed, but following their full type surface makes a cold-cache
# run take minutes; we typecheck kalos's own code, not theirs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch.*", "botorch.*", "gpytorch.*", "linear_operator.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
