[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalos"
version = "0.1.0"
description = "Kalos: a domain-neutral Bayesian-optimization platform for sequential experiment design, built on BoTorch. Ships a bioprocess domain (NVIDIA BioNeMo / ESM-2 protein features) and supports mixed continuous/categorical design spaces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
# The BoTorch/GPyTorch GP surrogate, optimizer, and grouped-CV evaluation. The
# torch-free `kalos.kit` primitives (splits, drivers, conformal, gates,
# anonymizer) do not need this extra.
ml = ["torch>=2.2", "botorch>=0.11", "gpytorch>=1.11"]
# Real ESM-2 / BioNeMo protein embeddings. The lean KmerEmbedder needs none of this.
protein = ["transformers>=4.40"]
# The web portal (FastAPI viewer over the live engine). The portal drives the
# live GP surrogate, so it needs `ml` too - install as `kalos[ml,portal]`.
portal = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "openpyxl>=3.1"]
# The LLM tier of `kalos.normalize` (kalos/normalize/llm.py). Pydantic ships
# as a transitive dependency of `anthropic` and is not listed separately.
# The torch-free deterministic core (units/synonyms/plan/apply) and the
# offline fallback in llm.py need none of this.
normalize = ["anthropic>=0.40"]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "scipy-stubs"]

[tool.setuptools.packages.find]
include = ["kalos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
packages = ["kalos"]
# Third-party libs without usable stubs in this project's context. torch/botorch/
# gpytorch DO ship py.typed, but following their full type surface makes a cold-cache
# run take minutes; we typecheck kalos's own code, not theirs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch.*", "botorch.*", "gpytorch.*", "linear_operator.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
