[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalos"
version = "0.1.0"
description = "Kalos: a Bayesian-optimization platform for bioprocess development, built on BoTorch with NVIDIA BioNeMo / ESM-2 protein features."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "torch>=2.2",
  "botorch>=0.11",
  "gpytorch>=1.11",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
# Real ESM-2 / BioNeMo protein embeddings. The lean KmerEmbedder needs none of this.
protein = ["transformers>=4.40"]
# The web portal (FastAPI viewer over the live engine).
portal = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "openpyxl>=3.1"]
# Diagnostic figures (kalos.diagnostics): parity, CV forest, parallel-coords, PCA, PDP.
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["kalos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
