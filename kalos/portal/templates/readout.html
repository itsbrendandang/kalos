<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scale-Up Readout</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 32px;
    background: #ffffff;
    color: #1a1f2b;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 12px;
    line-height: 1.35;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #5a6472; margin: 16px 0 6px; border-bottom: 1px solid #dde2e8; padding-bottom: 3px; }
  .subtitle { color: #5a6472; margin: 0 0 14px; font-size: 11px; }
  .banner { padding: 10px 14px; border-radius: 4px; font-weight: 600; font-size: 13px; margin-bottom: 12px; }
  .banner-number { background: #e5f4ea; color: #1e6b3a; border: 1px solid #b6ddc4; }
  .banner-warning { background: #fdf3dc; color: #8a5a00; border: 1px solid #ecd39a; }
  .banner-refusal { background: #fbe9e9; color: #a02020; border: 1px solid #eec2c2; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 18px; margin-bottom: 4px; }
  .kv { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted #e3e6ea; padding: 1px 0; }
  .kv .k { color: #5a6472; }
  .kv .v { font-weight: 600; text-align: right; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
  table th, table td { text-align: left; padding: 3px 6px; border-bottom: 1px solid #e9ecef; font-size: 11px; }
  table th { background: #f4f6f8; color: #444; font-weight: 600; }
  .reasons { margin: 4px 0 0; padding-left: 18px; }
  .reasons li { margin-bottom: 2px; }
  .muted { color: #5a6472; }
  .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; word-break: break-all; }
  .provenance dt { color: #5a6472; margin-top: 4px; }
  .provenance dd { margin: 0 0 3px; }
  .intended-use { margin-top: 16px; padding-top: 8px; border-top: 1px solid #dde2e8; font-size: 10px; color: #5a6472; font-style: italic; }
  @media print {
    body { padding: 0.35in; }
  }
  @page {
    size: Letter;
    margin: 0.4in;
  }
</style>
</head>
<body>
<h1>Scale-Up Readout</h1>
<p class="subtitle">Kalos ScaleBridge - development decision support</p>
${body}
<p class="intended-use">${intended_use}</p>
</body>
</html>
